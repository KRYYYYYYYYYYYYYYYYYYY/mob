name: Push Base64 to Another Repo

on:
  push:
    paths:
      - 'kr/mob/wifi.txt'
  workflow_dispatch:

jobs:
  push-to-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Create Base64 file
        run: |
          mkdir -p kr/mob
          if [ -f kr/mob/wifi.txt ]; then
            # Создаем файл сразу с ID в названии
            base64 -w 0 kr/mob/wifi.txt > kykyk.ioZjl2e1.txt
          else
            echo "Файл не найден!" && exit 1
          fi

      - name: Sync with GitHub and GitVerse
        env:
          GH_TOKEN: ${{ secrets.MY_TOKEN }}
          GV_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
        run: |
          # 1. Настройка личности
          git config --global user.name "SyncBot"
          git config --global user.email "bot@example.com"
          
          # --- ШАГ 1: ПУШ В GITHUB ---
          rm -rf gh_repo
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/kyti.git" gh_repo
          # Копируем файл с новым именем
          cp kykyk.ioZjl2e1.txt gh_repo/
          cd gh_repo
          git add kykyk.ioZjl2e1.txt
          git commit -m "Update encrypted data with ID from GH Action" || echo "No changes"
          git push
          cd .. 

          # --- ШАГ 2: ПУШ В GITVERSE ---
          rm -rf gv_repo
          git clone --quiet "https://Kreyker:${GV_TOKEN}@gitverse.ru/Kreyker/kyti.git" gv_repo
          # Копируем файл с новым именем
          cp kykyk.ioZjl2e1.txt gv_repo/
          cd gv_repo
          git add kykyk.ioZjl2e1.txt
          git commit -m "Update from GitHub Sync with ID" || echo "No changes"
          git push
          cd ..
