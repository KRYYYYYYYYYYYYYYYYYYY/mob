name: Push Base64 to Another Repo

on:
  push:
    paths:
      - 'kr/mob/wifi.txt'
  workflow_dispatch:

jobs:
  push-to-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Create Base64 file
        run: base64 -w 0 kr/mob/wifi.txt > kykyk.txt

      - name: Push to Second Repo
        env:
          API_TOKEN_GITHUB: ${{ secrets.MY_TOKEN }}
        run: |
          # Setup identity
          git config --global user.name "SyncBot"
          git config --global user.email "bot@example.com"
          
          # 1. Corrected Clone URL
          # Removed the extra "://" and added missing "/"
          git clone "https://x-access-token:${API_TOKEN_GITHUB}@github.com/${{ github.repository_owner }}/kyti.git" target_repo
          
          # 2. Copy the file
          cp kykyk.txt target_repo/
          
          # 3. Commit and Push
          cd target_repo
          git add kykyk.txt
          # Using || exit 0 ensures the workflow doesn't fail if there's nothing to change
          git commit -m "Update encrypted data from ${{ github.sha }}" || echo "No changes to commit"
          git push
