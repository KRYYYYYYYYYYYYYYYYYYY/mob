name: Push Base64 to Another Repo

on:
  push:
    paths:
      - 'wifi.txt' # Робот сработает только когда ты изменишь этот файл
  workflow_dispatch:

jobs:
  push-to-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Create Base64 file
        run: base64 -w 0 wifi.txt > kykyk.txt

      - name: Push to Second Repo
        env:
          API_TOKEN_GITHUB: ${{ secrets.MY_TOKEN }}
        run: |
          git config --global user.name "SyncBot"
          git config --global user.email "bot@example.com"
          
          # 1. Клонируем второй репозиторий (Витрину) во временную папку target_repo
          # Используем токен для доступа
          git clone https://x-access-token:${API_TOKEN_GITHUB}@://github.com{{ github.repository_owner }}/kyti.git target_repo
          
          # 2. Копируем свежий kykyk.txt из основной папки во вторую
          cp kykyk.txt target_repo/
          
          # 3. Переходим в папку второго репо и отправляем изменения
          cd target_repo
          git add kykyk.txt
          git commit -m "Update encrypted data" || echo "No changes to commit"
          git push
