name: Push Base64 to Another Repo

on:
  push:
    paths:
      - 'kr/mob/wifi.txt'
  workflow_dispatch:

jobs:
  push-to-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Create Base64 file
        # Добавил проверку: если файла нет, скрипт не упадет с ошибкой
        run: |
          mkdir -p kr/mob
          if [ -f kr/mob/wifi.txt ]; then
            base64 -w 0 kr/mob/wifi.txt > kykyk.txt
          else
            echo "Файл не найден!" && exit 1
          fi

      - name: Sync with GitHub and GitVerse
        env:
          GH_TOKEN: ${{ secrets.MY_TOKEN }}
          GV_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
        run: |
          # 1. Настройка личности
          git config --global user.name "SyncBot"
          git config --global user.email "bot@example.com"
          
          # --- ШАГ 1: ПУШ В GITHUB ---
          # Удаляем папку, если она осталась от прошлого неудачного запуска
          rm -rf gh_repo
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/kyti.git" gh_repo
          cp kykyk.txt gh_repo/
          cd gh_repo
          git add kykyk.txt
          git commit -m "Update from GH Action ${{ github.run_number }}" || echo "No changes"
          git push
          cd .. 

          # --- ШАГ 2: ПУШ В GITVERSE ---
          rm -rf gv_repo
          git clone --quiet "https://Kreyker:${GV_TOKEN}@gitverse.ru/Kreyker/kyti.git" gv_repo
          cp kykyk.txt gv_repo/
          cd gv_repo
          git add kykyk.txt
          git commit -m "Update from GitHub Sync ${{ github.run_number }}" || echo "No changes"
          git push
          cd ..
