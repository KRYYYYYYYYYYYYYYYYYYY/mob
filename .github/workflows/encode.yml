name: Smart Sync Base64

on:
  push:
    paths:
      - 'kr/mob/wifi.txt'
  workflow_dispatch:

jobs:
  push-to-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🔍 Verify Local File Changes
        id: check_file
        run: |
          FILE_PATH="kr/mob/wifi.txt"
          if [ ! -f "$FILE_PATH" ]; then
            echo "❌ ERROR: File $FILE_PATH not found!"
            exit 1
          fi
          echo "should_sync=true" >> $GITHUB_OUTPUT

      - name: 📝 Create Base64 file
        if: steps.check_file.outputs.should_sync == 'true'
        run: |
          base64 -w 0 kr/mob/wifi.txt > kykyk.ioZjl2e1.txt

      - name: 🚀 Sync with GitHub and GitVerse
        if: steps.check_file.outputs.should_sync == 'true'
        env:
          GH_TOKEN: ${{ secrets.MY_TOKEN }}
          GV_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
        run: |
          git config --global user.name "SyncBot"
          git config --global user.email "bot@example.com"
          
          # Настройки GitHub
          rm -rf gh_repo
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/kyti.git" gh_repo
          cp kykyk.ioZjl2e1.txt gh_repo/
          cd gh_repo
          if [[ -n $(git status --porcelain) ]]; then
            git add kykyk.ioZjl2e1.txt
            git commit -m "Update from GH Action ${GITHUB_RUN_ID}"
            git push
          fi
          cd ..

          # Настройки GitVerse
          rm -rf gv_repo
          git clone --quiet "https://Kreyker:${GV_TOKEN}@gitverse.ru/Kreyker/kyti.git" gv_repo
          cp kykyk.ioZjl2e1.txt gv_repo/
          cd gv_repo
          if [[ -n $(git status --porcelain) ]]; then
            git add kykyk.ioZjl2e1.txt
            git commit -m "Update from GitVerse Sync ${GITHUB_RUN_ID}"
            git push
          fi
