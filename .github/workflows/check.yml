name: 🧩 Reserve Checker

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: reserve-check-lock
  cancel-in-progress: false

jobs:
  reserve_check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 🛠️ Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: 📥 Install Xray core
        run: |
          set -euo pipefail
          bash new_check/install-go-xray.sh

      - name: 📦 Build reserve checker
        working-directory: new_check
        run: |
          go build -o crazy_checker .

      - name: ▶️ Run reserve checker
        working-directory: new_check
        env:
          RESERVE_MTU_VALUE: "1400"
          XRAY_BIN: /usr/local/bin/xray
        run: ./crazy_checker -workers 24 -maxworkcfg 200

      - name: 💾 Commit reserve updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add kr/mob/wifi.txt new_check/result/working.txt new_check/result/first_working.txt new_check/result/result.txt new_check/result/time_wifi.txt
          git commit -m "🧩 Update reserve tail in wifi [skip ci]" || echo "No changes to commit"
          git pull --rebase --autostash -X theirs origin main
          git push origin main
