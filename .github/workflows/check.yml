name: 🧩 Reserve Checker

on:
  workflow_run:
    workflows: ["Auto Update VPN"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: reserve-check-lock
  cancel-in-progress: true

jobs:
  reserve_check:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 🛠️ Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: 📦 Build reserve checker
        run: |
          cd new_check
          go mod tidy
          go build -o crazy_checker .

      - name: ▶️ Run reserve checker
        env:
          RESERVE_MTU_VALUE: "1400"
          XRAY_BIN: xray
        run: ./new_check/crazy_checker -workers 24 -maxworkcfg 200

      - name: 💾 Commit reserve updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add kr/mob/wifi.txt new_check/result/working.txt new_check/result/first_working.txt new_check/result/result.txt
          git commit -m "🧩 Update reserve tail in wifi [skip ci]" || echo "No changes to commit"
          git pull --rebase -X theirs origin main
          git push origin main
