name: 🛡️ Proxy Inquisitor & Monitor

concurrency:
  group: proxy-inquisitor-lock
  cancel-in-progress: false

on:
  push:
    paths:
      - 'kr/mob/wifi.txt'
      - 'test1/vetted.txt'
      - 'test1/pinned.txt'
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: write
      # issues permissions intentionally omitted: issue-control moved to control-bot.yml

    steps:
      - name: 📂 Checkout Code
        uses: actions/checkout@v4

      - name: 🧠 Gate by last successful run (+2h)
        id: gate
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const wfRef = context.workflowRef || '';
            const m = wfRef.match(/\.github\/workflows\/([^@]+)@/);
            const workflow_id = m ? m[1] : 'checker.yml';

            const res = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id,
              status: 'completed',
              per_page: 30
            });

            const nowRunId = context.runId;
            const lastSuccess = res.data.workflow_runs.find(
              r => r.conclusion === 'success' && r.id !== nowRunId
            );

            if (!lastSuccess) {
              core.info('No previous successful run -> allow.');
              core.setOutput('should_run', 'true');
              return;
            }

            const last = new Date(lastSuccess.updated_at).getTime();
            const now = Date.now();
            const diffMs = now - last;
            const cooldownMs = 2 * 60 * 60 * 1000;

            core.info(`Last success: ${lastSuccess.updated_at}`);
            core.info(`Minutes since: ${Math.floor(diffMs / 60000)}`);
            core.setOutput('should_run', diffMs >= cooldownMs ? 'true' : 'false');

      - name: ⏭️ Skip (cooldown not reached)
        if: steps.gate.outputs.should_run != 'true'
        run: echo "Cooldown < 2h since last successful run. Skipping."

      - name: 🛠️ Setup Go
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: 🔧 Build Go L7 Library
        if: steps.gate.outputs.should_run == 'true'
        run: |
          rm -f go.mod go.sum
          go mod init proxy_checker
          go get github.com/xtls/xray-core@v1.8.24
          go get github.com/xtls/xray-core/infra/conf/serial@v1.8.24
          go mod tidy
          go build -buildmode=c-shared -ldflags="-s -w" -o libchecker.so checker.go

      - name: 🐍 Setup Python
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ⚙️ Install dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests cryptography psutil

      - name: ⛓️ Run Torturer
        if: steps.gate.outputs.should_run == 'true'
        env:
          # keep checker runtime env minimal; control env belongs to control-bot.yml
          LD_LIBRARY_PATH: .
          PYTHONUNBUFFERED: "1"
        run: python -u torture_bot.py

      - name: 💾 Save Results
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "📊 Sync: Ranking and Vetted updated [skip ci]" || echo "No changes to commit"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && break || sleep $((i*5))
          done
          for i in 1 2 3; do
            git push origin main && break || sleep $((i*10))
          done
