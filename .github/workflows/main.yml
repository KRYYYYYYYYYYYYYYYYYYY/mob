name: Auto Update VPN

concurrency:
  group: vpn-manager-lock
  cancel-in-progress: false

on:
  schedule:
    - cron: '*/10 * * * *'   # частый "тик"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      actions: read           # нужно для чтения history runs
      contents: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- GATE: запускать не чаще чем раз в 2 часа после УСПЕШНОГО завершения ---
      - name: Gate by last successful run (+2h)
        id: gate
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // workflow file name from workflow_ref:
            // owner/repo/.github/workflows/main.yml@refs/heads/main
            const wfRef = context.workflowRef || '';
            const m = wfRef.match(/\.github\/workflows\/([^@]+)@/);
            const workflow_id = m ? m[1] : 'main.yml';

            const res = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id,
              status: 'completed',
              per_page: 20
            });

            // последний success НЕ текущий run
            const nowRunId = context.runId;
            const lastSuccess = res.data.workflow_runs.find(
              r => r.conclusion === 'success' && r.id !== nowRunId
            );

            if (!lastSuccess) {
              core.info('No previous successful runs found -> allow run.');
              core.setOutput('should_run', 'true');
              return;
            }

            const last = new Date(lastSuccess.updated_at).getTime(); // время завершения
            const now = Date.now();
            const diffMs = now - last;
            const twoHoursMs = 2 * 60 * 60 * 1000;

            core.info(`Last success at: ${lastSuccess.updated_at}`);
            core.info(`Minutes since last success: ${Math.floor(diffMs / 60000)}`);

            if (diffMs >= twoHoursMs) {
              core.setOutput('should_run', 'true');
            } else {
              core.setOutput('should_run', 'false');
            }

      - name: Skip (cooldown not reached)
        if: steps.gate.outputs.should_run != 'true'
        run: echo "Cooldown < 2h since last successful run. Skipping."

      - name: Set up Go
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Build Go L7 Library
        if: steps.gate.outputs.should_run == 'true'
        run: |
          rm -f go.mod go.sum
          go mod init proxy_checker
          go get github.com/xtls/xray-core@v1.8.24
          go get github.com/xtls/xray-core/infra/conf/serial@v1.8.24
          go mod tidy
          go build -buildmode=c-shared -ldflags="-s -w" -o libchecker.so checker.go

      - name: Set up Python
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests cryptography certifi

      - name: 🌪️ Setup "Censorship" Environment
        if: steps.gate.outputs.should_run == 'true'
        run: |
          sudo tc qdisc replace dev eth0 root netem delay 150ms 20ms loss 5%
          sudo ifconfig eth0 mtu 1280

      - name: Run checker
        if: steps.gate.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PROMPT_DISABLED: 1
          GITHUB_REPOSITORY: ${{ github.repository }}
          LD_LIBRARY_PATH: .
        run: python check.py

      - name: Commit and Push changes
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git config --global user.name "Checker-Bot"
          git config --global user.email "bot@github.com"
          echo "libchecker.so" >> .gitignore
          echo "libchecker.h" >> .gitignore
          git add .
          git commit -m "Auto-update: DB and Subscription" || echo "No changes to commit"
          git pull --rebase -X theirs origin main
          git push origin main
