name: Auto Update VPN

concurrency:
  group: vpn-manager-lock
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:
    inputs:
      rerun_once:
        description: 'Внутренний флаг: этот запуск был автоматически отправлен для последующего повторного запуска'
        required: false
        default: 'false'
      force_run:
        description: 'Принудительный запуск без ожидания 1 часа'
        required: false
        default: 'false'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- GATE: запускать только спустя 1 час после последнего SUCCESS ---
      - name: Gate by last successful run (+1h)
        id: gate
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'main.yml';
            const branch = 'main';
            const cooldownMs = 60 * 60 * 1000; // 1 hour fixed

            const isDispatch = context.eventName === 'workflow_dispatch';
            const inputs = (context.payload && context.payload.inputs) || {};
            const forceRun = isDispatch && String(inputs.force_run || 'false') === 'true';
            if (forceRun) {
              core.info('force_run=true -> bypass cooldown for this run.');
              core.setOutput('should_run', 'true');
              core.setOutput('reason', 'forced');
              return;
            }

            const res = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id,
              branch,
              status: 'completed',
              per_page: 100
            });

            const nowRunId = context.runId;
            const lastSuccess = res.data.workflow_runs.find(
              r => r.conclusion === 'success' && r.id !== nowRunId
            );

            if (!lastSuccess) {
              core.info('No previous successful run on main -> allow.');
              core.setOutput('should_run', 'true');
              core.setOutput('reason', 'no_previous_success');
              return;
            }

            const lastSuccessAt = new Date(lastSuccess.updated_at).getTime();
            const now = Date.now();
            const diffMs = now - lastSuccessAt;
            const remainMs = cooldownMs - diffMs;

            core.info(`Last success run id: ${lastSuccess.id}`);
            core.info(`Last success at (UTC): ${lastSuccess.updated_at}`);
            core.info(`Minutes since last success: ${Math.floor(diffMs / 60000)}`);

            if (diffMs >= cooldownMs) {
              core.setOutput('should_run', 'true');
              core.setOutput('reason', 'cooldown_reached');
            } else {
              core.setOutput('should_run', 'false');
              core.setOutput('reason', 'cooldown_not_reached');
              core.setOutput('minutes_left', String(Math.ceil(remainMs / 60000)));
            }

      - name: Cancel run (cooldown not reached)
        if: steps.gate.outputs.should_run != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run_id = context.runId;
            const left = '${{ steps.gate.outputs.minutes_left }}' || '?';
            core.notice(`Cooldown < 1h (left ~${left} min) -> cancelling run ${run_id}`);
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id
            });

      # --- УСТАНОВКА И СБОРКА XRAY L7 ЧЕКЕРА ---
      - name: Set up Go
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.21' # Рекомендуется 1.21 для стабильной работы xray-core
          cache: false

      - name: Build Go L7 Library
        if: steps.gate.outputs.should_run == 'true'
        run: |
          rm -f go.mod go.sum
          go mod init proxy_checker
          # Тянем основное ядро и парсер JSON
          go get github.com/xtls/xray-core@v1.8.24
          go get github.com/xtls/xray-core/infra/conf/serial@v1.8.24
          go mod tidy
          # Компиляция с флагами для уменьшения веса
          go build -buildmode=c-shared -ldflags="-s -w" -o libchecker.so checker.go
          
      - name: Set up Python
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests cryptography certifi
          # Optional dependency: do not fail workflow if unavailable on current index/mirror
          pip install v2ray-python || echo "v2ray-python is unavailable; continuing without server-stats RPC helper"

      - name: 🌪️ Setup "Censorship" Environment
        if: steps.gate.outputs.should_run == 'true'
        run: |
          sudo tc qdisc replace dev eth0 root netem delay 150ms 20ms loss 5%
          sudo ifconfig eth0 mtu 1280
      
      - name: Run checker (round 1)
        if: steps.gate.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
          GH_PROMPT_DISABLED: 1
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Указываем системе искать .so файл в текущей директории
          LD_LIBRARY_PATH: .
          CHECK_FAIL_ON_ZERO_ALIVE: 0
        run: python check.py

      - name: Decide rerun from run_result.json
        id: decide_rerun
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python - <<'PY'
          import json, os
          path = "test1/run_result.json"
          should = "false"
          if os.path.exists(path):
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)
              checked = int(data.get("checked_today", 0) or 0)
              alive = int(data.get("alive_today", 0) or 0)
              # Перезапускаем только если проверки были, но ни одного нового живого не нашли.
              if checked > 0 and alive == 0:
                  should = "true"
              print(f"run_result: checked_today={checked}, alive_today={alive}, should_rerun={should}")
          else:
              print("run_result.json not found, skip rerun")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"should_rerun={should}\n")
          PY

      - name: Commit and Push changes
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git config --global user.name "Checker-Bot"
          git config --global user.email "bot@github.com"
          
          # Мы не хотим пушить тяжелую библиотеку .so в репозиторий
          # Добавим её в игнор перед коммитом на всякий случай
          echo "libchecker.so" >> .gitignore
          echo "libchecker.h" >> .gitignore
          
          git add .
          git commit -m "Auto-update: DB and Subscription" || echo "No changes to commit"
          git pull --rebase -X theirs origin main
          git push origin main

      - name: Queue follow-up workflow run (if needed)
        if: |
          steps.gate.outputs.should_run == 'true' &&
          steps.decide_rerun.outputs.should_rerun == 'true' &&
          (github.event_name != 'workflow_dispatch' || github.event.inputs.rerun_once != 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PROMPT_DISABLED: 1
        run: |
          echo "Scheduling follow-up run: checked>0 and alive_today=0"
          gh workflow run main.yml --repo "${{ github.repository }}" -f rerun_once=true
